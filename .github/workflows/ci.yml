name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: uv sync --extra dev
      - name: Create runtime config from examples
        working-directory: .
        run: |
          cp config.example.yaml config.yaml
          cp config/resume.example.json config/resume.json
      - run: make check
      - name: Verify no anthropic SDK import outside coach.py
        working-directory: .
        run: |
          if grep -r "import anthropic" backend/jobforce | grep -v "services/coach.py"; then
            echo "anthropic import found outside coach.py"; exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  chrome-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - run: npm ci
      - run: npm test
