t: #FFFFFF; --color-bubble-left: #00bcc9; --color-bubble-middle: #ffb420; --color-bubble-right: #fec900; --color-primary-button-background: ; --color-primary-button-text: ; --gradient-primary: unset; --font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',sans-serif; }</style><script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Senior Full-stack Software Engineer","description":"About Us and Position Overview<p>Kettle is a fast growing Managing General Agency (MGA) specializing in wildfire insurance combining advanced underwriting technology with deep industry experience. </p><p>We’re looking for a Senior Full-stack Software Engineer with strong DevOps experience and front-end abilities to join our engineering team. In this role, you will architect, build, and maintain core systems across our AWS-based stack, contribute to front-end product development, and help scale Kettle’s engineering infrastructure as we grow. This is a hands-on Senior IC role. You’ll start by shipping and improving systems directly, with scope and ownership expanding as you ramp.</p><p>You’ll work closely with data engineering, modeling, risk, and product teams to deliver performant, reliable, and secure systems that support our underwriting platform and geospatial analytics tools.</p><p>The salary range for this role is $140,000-180,000</p><p></p>Why this role exists<p>As Kettle grows, our engineering systems are becoming more central to underwriting, mapping, and data science workflows. We are a small, senior engineering team where backend and modeling capabilities are strong, but we are looking to further elevate our infrastructure, DevOps posture, and front-end tooling as our platform scales.</p><p>Today, much of the system works well and supports real underwriting decisions in production. However, as usage increases, we need to improve deployment reliability, observability, infrastructure consistency, and the overall developer experience. This role exists to help us proactively strengthen those foundations rather than reacting to scale challenges later.</p><p>We are looking for a senior engineer who can improve the reliability, scalability, and developer experience of our AWS-based platform while also contributing to the internal tools and interfaces used by underwriting and risk teams every day.</p><p>This is a product-minded engineer who is comfortable across the stack, with primary strength in infrastructure, followed by front-end tooling, and backend systems. You will have meaningful autonomy in shaping how we deploy, monitor, and evolve our systems, and will play a key role in raising the engineering bar as we grow.</p><p></p>What success looks like<p>In the first 6 months, you will:</p><ul><li>Improve observability, monitoring, and deployment reliability</li><li>Ship meaningful improvements to internal dashboards and underwriting tools </li><li>Become a key partner to data engineering and modeling teams for system reliability</li></ul><p>In 12 months, you will:</p><ul><li>Have materially improved our DevOps posture and developer workflows</li><li>Be a go-to person for infrastructure and architecture decisions</li><li>Help shape how new underwriting and mapping products are deployed and supported</li><li>Raise the engineering standard across backend, infra, and internal tooling</li></ul><p></p>Core Responsibilities<p>Primary Focus: Infrastructure &amp; DevOps</p><ul><li>Improve parts of Kettle’s AWS infrastructure, CI/CD, and containerized workloads</li><li>Implement and maintain infrastructure-as-code (Terraform or equivalent)</li><li>Improve observability, logging, monitoring, deployment reliability, and cost efficiency</li></ul><p>Secondary Focus: Front-end Tooling</p><ul><li>Build and maintain internal dashboards and tools in React/TypeScript</li></ul><p>Supporting Role: Back-end</p><ul><li>Contribute to architecture decisions across backend, infrastructure, and applications</li><li>Design and maintain backend services and internal APIs (Python)</li></ul>\n<p>Essential Experience of a Successful Candidate</p><ul><li>Bachelor’s degree in Computer Science, Engineering, or related field</li><li>5+ years of professional software development experience, including ownership of production systems</li></ul><p></p><p>Strong experience in:</p><ul><li>Operating production systems in AWS (ECS, EC2, Lambda, S3, IAM, RDS, etc.)</li><li>DevOps practices: CI/CD, Docker, monitoring, reliability, security best practices</li><li>Infrastructure-as-code and reproducible environments</li><li>React / TypeScript frontend development</li><li>Postgres and database-backed applications</li><li>Experience in python development, including packaging and environment management</li></ul><p></p><p>You have demonstrated ability to:</p><ul><li>Own systems end-to-end, from design through deployment and ongoing operation</li><li>Work effectively in small teams and ambiguous, fast-moving environments</li><li>Make pragmatic architectural trade-offs balancing speed, reliability, and scalability</li><li>Improve engineering workflows, deployment processes, and overall system reliability</li><li>Identify and proactively address infrastructure or operational bottlenecks before they become critical issues</li></ul><p></p><p>Work authorization</p><ul><li>Unfortunately, we are not able to provide visa sponsorship for this role. Only candidates who are currently authorized to work in the United States on a full-time basis will be considered.</li></ul>\n<ul><li>Be part of a mission-driven company tackling real-world challenges.</li><li>Work with a passionate and innovative team in a collaborative environment.</li><li>Opportunity to influence cutting-edge wildfire risk modeling in a dynamic industry.</li><li>Competitive salary and benefits package, including remote work.</li><li>This position is eligible for stock options (subject to board approval).</li></ul><p></p><p>Our Kettle Inc. (\"Kettle\") is an equal opportunity employer. Kettle provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, sexual orientation, gender identity or expression, or any other characteristic protected by federal, state, or local laws.</p>","identifier":{"@type":"PropertyValue","name":"id","value":"94db3079-7e5b-4c61-a36e-0f2212123bb4"},"datePosted":"2026-02-24T22:07:54.397Z","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"Kettle","logo":"https://workablehr.s3.amazonaws.com/uploads/account/logo/452508/logo","url":"https://www.ourkettle.com/","sameAs":"https://jobs.workable.com/company/pyP2qMcBbs7sqzXTsCJhxo/jobs-at-kettle"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"United States"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"},"directApply":true,"id":"94db3079-7e5b-4c61-a36e-0f2212123bb4","benefitsSection":"<ul><li>Be part of a mission-driven company tackling real-world challenges.</li><li>Work with a passionate and innovative team in a collaborative environment.</li><li>Opportunity to influence cutting-edge wildfire risk modeling in a dynamic industry.</li><li>Competitive salary and benefits package, including remote work.</li><li>This position is eligible for stock options (subject to board approval).</li></ul><p></p><p>Our Kettle Inc. (\"Kettle\") is an equal opportunity employer. Kettle provides equal employment opportunities to all employees and applicants for employment and prohibits discrimination and harassment of any type without regard to race, color, religion, age, sex, national origin, disability status, genetics, protected veteran status, se
