openapi: 3.1.0
info:
  title: Jobforce API
  description: Local API behind the Jobforce dashboard, Chrome extension, and Claude Code skills. Business
    errors return `{detail, code}`; branch on `code`.
  version: 0.1.0
paths:
  /api/ingest:
    post:
      tags:
      - scout
      summary: Capture a job listing
      description: 'Store a listing posted by the Chrome extension or a crawler skill, creating

        the company if needed. Deduplicates on `source_url`: a repeat returns 409 with

        the existing job instead of creating a new one.'
      operationId: post_ingest_api_ingest_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '409':
          description: 'Duplicate: source_url already captured; body is the existing job'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs:
    get:
      tags:
      - jobs
      summary: List and filter job listings
      description: 'Return one page of job listings plus the total match count.


        All text filters are case-insensitive substring matches unless noted. Nulls sort

        last in either direction.'
      operationId: get_jobs_api_jobs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only jobs in this status (saved, archived, shortlisted, applied, interviewing,
            offer, rejected, withdrawn). When omitted, archived/withdrawn/rejected jobs are excluded (unless
            source_url is given).
          title: Status
        description: Only jobs in this status (saved, archived, shortlisted, applied, interviewing, offer,
          rejected, withdrawn). When omitted, archived/withdrawn/rejected jobs are excluded (unless source_url
          is given).
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Exact company id
          title: Company Id
        description: Exact company id
      - name: company
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on company name
          title: Company
        description: Case-insensitive substring match on company name
      - name: fit_scored
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter on whether Oracle has scored it
          title: Fit Scored
        description: Filter on whether Oracle has scored it
      - name: min_score
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum fit_score (0.0–1.0)
          title: Min Score
        description: Minimum fit_score (0.0–1.0)
      - name: location
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on location
          title: Location
        description: Case-insensitive substring match on location
      - name: role_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact role type (full-time, part-time, contract, internship, other)
          title: Role Type
        description: Exact role type (full-time, part-time, contract, internship, other)
      - name: source_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact-match lookup by posting URL, to check whether a job is already captured.
            Matches regardless of pipeline status.
          title: Source Url
        description: Exact-match lookup by posting URL, to check whether a job is already captured. Matches
          regardless of pipeline status.
      - name: title
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on title
          title: Title
        description: Case-insensitive substring match on title
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on description
          title: Q
        description: Case-insensitive substring match on description
      - name: posted_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only jobs posted on/after this ISO date (YYYY-MM-DD)
          title: Posted After
        description: Only jobs posted on/after this ISO date (YYYY-MM-DD)
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          pattern: ^(fit_score|created_at|posted_at|title|status|company)$
          description: Sort column; ties break on created_at desc for stable paging
          default: fit_score
          title: Sort By
        description: Sort column; ties break on created_at desc for stable paging
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: asc or desc
          default: desc
          title: Sort Dir
        description: asc or desc
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size (1–200)
          default: 50
          title: Limit
        description: Page size (1–200)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Rows to skip
          default: 0
          title: Offset
        description: Rows to skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/bulk-archive:
    post:
      tags:
      - jobs
      summary: Archive many jobs at once
      description: "Archive jobs in one of three modes.\n\n- Default: `saved` jobs with `fit_score < 0.50`\
        \ (optionally for one company);\n  shortlisted, unscored and in-pipeline jobs are skipped.\n-\
        \ `all_active=true`: every `saved`/`shortlisted` job for `company_id`.\n- `saved_only=true`: every\
        \ `saved` job for `company_id`, any score.\n\n`all_active` and `saved_only` require `company_id`\
        \ and are mutually exclusive."
      operationId: bulk_archive_jobs_api_jobs_bulk_archive_post
      parameters:
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Limit to one company; required with all_active or saved_only
          title: Company Id
        description: Limit to one company; required with all_active or saved_only
      - name: all_active
        in: query
        required: false
        schema:
          type: boolean
          description: Archive every saved/shortlisted job for company_id regardless of fit score, instead
            of only low-score (<0.50) saved jobs. Requires company_id.
          default: false
          title: All Active
        description: Archive every saved/shortlisted job for company_id regardless of fit score, instead
          of only low-score (<0.50) saved jobs. Requires company_id.
      - name: saved_only
        in: query
        required: false
        schema:
          type: boolean
          description: Archive every saved job for company_id regardless of fit score, leaving shortlisted
            jobs untouched. Requires company_id.
          default: false
          title: Saved Only
        description: Archive every saved job for company_id regardless of fit score, leaving shortlisted
          jobs untouched. Requires company_id.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkArchiveResult'
        '422':
          description: 'Business error. code: MISSING_COMPANY_ID | CONFLICTING_OPTIONS. Input-validation
            errors use HTTPValidationError (no code).'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BusinessError'
                - $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get one job with description and status history
      description: 'Return the full listing, including description, Oracle rationale, and the

        status history in chronological order.'
      operationId: get_job_api_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingDetail'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - jobs
      summary: Update job fields (not status)
      description: 'Set any of the given fields; omitted or null fields are left unchanged.


        Used by /oracle-rank to write fit scores. A `status` field is rejected (422):

        use `PATCH /jobs/{job_id}/status` so the move is validated and audited.'
      operationId: patch_job_api_jobs__job_id__patch
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingDetail'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - jobs
      summary: Delete a job listing
      description: Permanently delete the listing and its dependent rows. Prefer archiving.
      operationId: delete_job_api_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '204':
          description: Successful Response
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/reparse:
    post:
      tags:
      - jobs
      summary: Re-extract fields from the stored HTML snapshot
      description: 'Re-extract fields from the stored HTML snapshot using the current site adapter.


        Use this after improving a site adapter in `services/parse/sites/` to update

        title, location, role_type, and description without re-crawling the page.

        Returns 404 if the job or its snapshot does not exist.'
      operationId: reparse_job_api_jobs__job_id__reparse_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingDetail'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND | SNAPSHOT_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/status:
    patch:
      tags:
      - jobs
      summary: Move a job to a new pipeline status
      description: 'The only way to change `status`. Validates the move against the pipeline

        state machine and records a status_transitions row. Disallowed moves (e.g.

        saved → offer, or anything out of a terminal status) return INVALID_TRANSITION.'
      operationId: patch_job_status_api_jobs__job_id__status_patch
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPatchResponse'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: 'Business error. code: INVALID_TRANSITION. Input-validation errors use HTTPValidationError
            (no code).'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BusinessError'
                - $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/note:
    get:
      tags:
      - jobs
      summary: Get the job's note
      description: Return the single free-text note attached to this job.
      operationId: get_job_note_api_jobs__job_id__note_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobNoteOut'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND | NOTE_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - jobs
      summary: Create or replace the job's note
      description: Create the note if missing, otherwise replace its body.
      operationId: upsert_job_note_api_jobs__job_id__note_put
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobNoteUpsert'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobNoteOut'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - jobs
      summary: Delete the job's note
      description: Remove the note attached to this job.
      operationId: delete_job_note_api_jobs__job_id__note_delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '204':
          description: Successful Response
        '404':
          description: 'Business error. code: JOB_NOT_FOUND | NOTE_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/oracle/rank:
    post:
      tags:
      - oracle
      summary: 'Removed: run the /oracle-rank skill instead'
      description: 'Always returns RANKING_MOVED_TO_SKILL (501). Ranking runs in Claude Code via

        /oracle-rank, which writes scores with `PATCH /jobs/{job_id}`.'
      operationId: post_rank_api_oracle_rank_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankRequest'
        required: true
      responses:
        '501':
          description: 'Business error. code: RANKING_MOVED_TO_SKILL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /api/oracle/rank/{job_id}:
    get:
      tags:
      - oracle
      summary: Get a job's Oracle fit score
      description: 'Return the score and rationale; RANK_RESULT_NOT_FOUND if the job is missing or

        has not been scored yet.'
      operationId: get_rank_api_oracle_rank__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankResult'
        '404':
          description: 'Business error. code: RANK_RESULT_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/resume/tailored:
    get:
      tags:
      - forge
      summary: Get the latest tailored resume for a job
      description: Return the most recent tailored resume for a job, or null if none exists.
      operationId: get_tailored_resume_for_job_api_resume_tailored_get
      parameters:
      - name: job_id
        in: query
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TailoredResumeOut'
                - type: 'null'
                title: Response Get Tailored Resume For Job Api Resume Tailored Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/resume/base:
    get:
      tags:
      - forge
      summary: Get the base resume
      description: Return config/resume.json as the canonical profile (id 0).
      operationId: get_base_resume_api_resume_base_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeOut'
        '404':
          description: 'Business error. code: BASE_RESUME_MISSING'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
    put:
      tags:
      - forge
      summary: Replace the base resume
      description: Overwrite config/resume.json with the request body (used by /forge-import).
      operationId: put_base_resume_api_resume_base_put
      requestBody:
        description: Resume structured data. Not validated; stored as sent.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeStructuredData'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeOut'
  /api/resume/tailor:
    post:
      tags:
      - forge
      summary: Store a tailored resume from /forge-tailor
      description: 'Save a tailored resume produced by the /forge-tailor skill.


        The skill performs AI tailoring and sends the result here.

        This endpoint stores it and returns the diff vs the base resume.'
      operationId: post_tailor_api_resume_tailor_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailoredResumeOut'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND | BASE_RESUME_MISSING'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/resume/{resume_id}/export:
    post:
      tags:
      - forge
      summary: Export a resume to .tex and PDF
      description: 'Write .tex and PDF to output/ and return their paths.


        pdf_path is null when LaTeX is unavailable — this is not an error.

        resume_id=0 refers to the current base resume (config/resume.json).'
      operationId: export_resume_endpoint_api_resume__resume_id__export_post
      parameters:
      - name: resume_id
        in: path
        required: true
        schema:
          type: integer
          description: Resume id; 0 means the base resume
          title: Resume Id
        description: Resume id; 0 means the base resume
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportOut'
        '404':
          description: 'Business error. code: BASE_RESUME_MISSING | RESUME_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/coach/prep:
    post:
      tags:
      - coach
      summary: Store a prep pack generated by /coach-prep
      description: 'Save the skill''s questions as a new interview session for the job. No AI runs

        on the backend; the skill generates the questions.'
      operationId: post_prep_api_coach_prep_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepSessionOut'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/coach/jobs/{job_id}/latest-session:
    get:
      tags:
      - coach
      summary: Get the most recent prep session for a job
      description: Return the newest session; PREP_SESSION_NOT_FOUND if the job has none yet.
      operationId: get_latest_session_api_coach_jobs__job_id__latest_session_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          description: Job listing id
          title: Job Id
        description: Job listing id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepSessionOut'
        '404':
          description: 'Business error. code: JOB_NOT_FOUND | PREP_SESSION_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/coach/sessions/{session_id}/answer:
    post:
      tags:
      - coach
      summary: Submit an answer to a prep question
      description: 'Stub: validates the session and question, then returns placeholder feedback.

        AI evaluation is out of scope since the coach skill migration.'
      operationId: post_answer_api_coach_sessions__session_id__answer_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          description: Interview session id
          title: Session Id
        description: Interview session id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerFeedbackOut'
        '404':
